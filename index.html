<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Related Kanji Words 單字學習</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日語單字">
<meta name="theme-color" content="#3a6ea5">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#2b2b2b; --sub:#777;
  --accent:#3a6ea5; --accent2:#b0413e; --ok:#3d8b5f; --bad:#b0413e;
  --line:#e3e0da; --chip:#eceae5; --chipon:#3a6ea5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin-right:8px;white-space:nowrap}
.modes{display:flex;gap:6px}
.modes button{padding:7px 14px;border:1px solid var(--line);background:var(--chip);border-radius:18px;cursor:pointer;font-size:14px}
.modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#search{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:14px;min-width:180px}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.groups button{padding:4px 10px;border:1px solid var(--line);background:var(--chip);border-radius:14px;cursor:pointer;font-size:13px}
.groups button.on{background:var(--chipon);color:#fff;border-color:var(--chipon)}
.gtitle{font-size:16px;font-weight:700;background:#5a5a5a;color:#fff;padding:6px 12px;border-radius:6px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .num{font-size:12px;color:var(--sub)}
.card .w{font-size:26px;font-weight:700}
.card .w rt{font-size:11px;font-weight:400;color:var(--accent)}
.card .suffix{font-size:14px;color:var(--sub)}
.card .star{margin-left:auto;cursor:pointer;font-size:18px;color:#ccc;user-select:none}
.card .star.on{color:#e8a33d}
.meaning{margin-top:2px;font-size:15px}
.meaning .zh{font-weight:600;color:var(--accent2)}
.meaning .en{color:var(--sub);margin-left:8px}
.comps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.comp{border:1px solid var(--ink);border-radius:4px;padding:2px 10px;text-align:center;font-size:15px;background:#fafaf8}
.comp small{display:block;font-size:11px;color:var(--sub);font-style:italic}
.plus{color:var(--sub)}
.ex{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:16px}
.ex rt{font-size:10px;color:var(--accent)}
.ex .tr{font-size:13.5px;color:var(--sub);margin-top:2px}
.ex .trzh{font-size:14px;color:var(--ink)}
.hl{font-weight:700;color:var(--accent2)}
.count{font-size:13px;color:var(--sub);margin:6px 0}
/* anki */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:640px;margin:18px auto;text-align:center}
.bigkana{font-size:42px;font-weight:700;margin:30px 0}
.bigword{font-size:48px;font-weight:700;margin:14px 0}
.bigword rt{font-size:14px;font-weight:400;color:var(--accent)}
.ansrow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-size:15px}
.btn.show{background:var(--accent);color:#fff}
.btn.again{background:var(--bad);color:#fff}
.btn.good{background:var(--ok);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.statline{font-size:13px;color:var(--sub);margin-top:10px}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;font-size:14px}
.filterbar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;max-width:320px}
/* quiz */
.qstem{font-size:18px;margin:18px 0;text-align:left}
.qstem u{text-decoration:underline;text-underline-offset:4px}
.choices{display:flex;flex-direction:column;gap:8px;text-align:left}
.choices button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fafaf8;cursor:pointer;font-size:16px;text-align:left}
.choices button.correct{background:#e3f2e8;border-color:var(--ok)}
.choices button.wrong{background:#f7e3e2;border-color:var(--bad)}
.expl{margin-top:12px;text-align:left;font-size:14.5px;background:#f3f1ec;border-radius:8px;padding:10px 12px;display:none}
.qmeta{font-size:13px;color:var(--sub);text-align:left;margin-bottom:4px}
.scoreline{font-size:14px;margin-top:10px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;margin:40px 0}
@media (max-width:600px){ .card .w{font-size:22px} .bigkana{font-size:32px} .bigword{font-size:36px} }
</style>
</head>
<body>
<header>
  <h1>📖 Related Kanji Words</h1>
  <div class="modes">
    <button id="m-browse" class="on" onclick="setMode('browse')">分類瀏覽</button>
    <button id="m-anki" onclick="setMode('anki')">記憶卡</button>
    <button id="m-quiz" onclick="setMode('quiz')">練習題</button>
  </div>
  <input id="search" type="search" placeholder="搜尋單字／假名／意思…" oninput="renderBrowse()">
</header>
<main>
  <div id="v-browse">
    <div class="tabs" id="chTabs"></div>
    <div class="groups" id="grpChips"></div>
    <div class="count" id="cnt"></div>
    <div id="list"></div>
  </div>

  <div id="v-anki" style="display:none">
    <div class="filterbar">
      範圍：<select id="ankiScope" onchange="ankiInit()"></select>
      <label><input type="checkbox" id="ankiUnknownOnly" onchange="ankiInit()"> 只練「不記得」的卡</label>
      <button class="btn ghost" onclick="ankiResetProg()">重設進度</button>
    </div>
    <div class="panel" id="ankiPanel"></div>
  </div>

  <div id="v-quiz" style="display:none">
    <div class="filterbar">
      範圍：<select id="quizScope" onchange="quizInit()"></select>
      <button class="btn ghost" onclick="quizInit()">重新開始</button>
    </div>
    <div class="panel" id="quizPanel"></div>
  </div>
</main>

<script>
/* ===== DATA =====
entry: {id, w(漢字詞), k(かな), sx(後接註記), en, zh, comps:[[字,英]], ch(章), g(組),
        ex(例句, 假名用「漢字[かな]」標注), exEn, exZh,
        q:{t(類型), s(題幹, ＿＿或<u>), c:[4選項], a(正解index), e(解說)} }
*/
window.DATA = [];
</script>
<script>
DATA.push(
{id:1,w:"生かす",k:"いかす",sx:"",en:"make use of",zh:"活用；發揮",comps:[["生","live"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"これまでの経験[けいけん]を仕事[しごと]に生[い]かす。",exEn:"I make use of my experience at work.",exZh:"把至今的經驗活用在工作上。",q:{t:"yomi",s:"これまでの経験を仕事に<u>生かす</u>。",c:["いかす","うかす","せいかす","しょうかす"],a:0,e:"「生かす」讀作「いかす」，意思是活用、發揮。"}},
{id:2,w:"生き生き",k:"いきいき",sx:"（と／する）",en:"lively",zh:"生氣勃勃；神采奕奕",comps:[["生きる","live"],["生きる","live"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"彼女[かのじょ]は仕事中[しごとちゅう]、生[い]き生[い]きとしている。",exEn:"She is lively while she is at work.",exZh:"她工作時神采奕奕。",q:{t:"bunmyaku",s:"彼女は仕事中、（　　）としている。",c:["生き生き","続々","別々","次々"],a:0,e:"「生き生き（と）する」＝生氣勃勃。「続々」＝接連不斷、「次々」＝一個接一個，都不能接「としている」表狀態。"}},
{id:3,w:"生物",k:"せいぶつ",sx:"",en:"living thing",zh:"生物",comps:[["生","live"],["物","thing"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"海[うみ]で珍[めずら]しい生物[せいぶつ]を見[み]た。",exEn:"I saw a strange living thing in the ocean.",exZh:"在海裡看到了罕見的生物。",q:{t:"yomi",s:"海で珍しい<u>生物</u>を見た。",c:["せいぶつ","なまもの","しょうぶつ","せいもの"],a:0,e:"「生物」讀「せいぶつ」＝生物；讀「なまもの」時是「生食、生鮮食品」的意思。"}},
{id:4,w:"生命",k:"せいめい",sx:"",en:"life",zh:"生命",comps:[["生","live"],["命","life"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"事故[じこ]で生命[せいめい]の危険[きけん]を感[かん]じた。",exEn:"In the accident, I felt my life was in danger.",exZh:"在事故中感受到生命危險。",q:{t:"yomi",s:"事故で<u>生命</u>の危険を感じた。",c:["せいめい","しょうめい","せいみょう","しょうみょう"],a:0,e:"「生命」讀「せいめい」。「証明（しょうめい）」是證明。"}},
{id:5,w:"人生",k:"じんせい",sx:"",en:"life",zh:"人生",comps:[["人","human"],["生","live"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"人生[じんせい]は一度[いちど]きり！楽[たの]しまなくちゃ！",exEn:"We only have one life to live! Let's enjoy it!",exZh:"人生只有一次！要好好享受！",q:{t:"hyoki",s:"<u>じんせい</u>は一度きり！楽しまなくちゃ！",c:["人生","人世","仁生","人性"],a:0,e:"「じんせい」寫作「人生」。「人性」在日文中讀「じんせい」但意思是人性，此處語意應為「人生」。"}},
{id:6,w:"卒業生",k:"そつぎょうせい",sx:"",en:"graduated student",zh:"畢業生",comps:[["卒業","graduate"],["生","live"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"卒業生[そつぎょうせい]の代表[だいひょう]としてスピーチをする。",exEn:"I'll be making a speech on behalf of all the graduated students.",exZh:"作為畢業生代表致詞。",q:{t:"yomi",s:"<u>卒業生</u>の代表としてスピーチをする。",c:["そつぎょうせい","そつごうせい","そつぎょうしょう","そっきょうせい"],a:0,e:"「卒業生」讀「そつぎょうせい」。"}},
{id:7,w:"生じる",k:"しょうじる",sx:"",en:"occur",zh:"產生；發生",comps:[["生","born"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"説明[せつめい]が足[た]りず、誤解[ごかい]が生[しょう]じた。",exEn:"The explanation was not enough, and a misunderstanding occurred.",exZh:"說明不足，因而產生了誤會。",q:{t:"yomi",s:"説明が足りず、誤解が<u>生じた</u>。",c:["しょうじた","せいじた","いじた","うじた"],a:0,e:"「生じる」讀「しょうじる」＝產生、發生。注意「生」在此讀「しょう」。"}},
{id:8,w:"生まれつき",k:"うまれつき",sx:"",en:"since birth",zh:"天生；與生俱來",comps:[["生まれる","born"],["つく","attach"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"妹[いもうと]は生[う]まれつき体[からだ]が弱[よわ]い。",exEn:"My little sister has been physically weak since birth.",exZh:"妹妹天生身體就弱。",q:{t:"yomi",s:"妹は<u>生まれつき</u>体が弱い。",c:["うまれつき","いまれつき","しょうまれつき","せいまれつき"],a:0,e:"「生まれつき」讀「うまれつき」＝天生。"}},
{id:9,w:"生み出す",k:"うみだす",sx:"",en:"generate",zh:"創造出；產生出",comps:[["生む","give birth"],["出す","out"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"生：live / born / give birth",ex:"新[あたら]しいアイデアを生[う]み出[だ]す。",exEn:"I generate new ideas.",exZh:"創造出新點子。",q:{t:"bunmyaku",s:"新しいアイデアを（　　）。",c:["生み出す","取り除く","聞き取る","発揮する"],a:0,e:"「アイデアを生み出す」＝想出／創造出新點子。「発揮する」是發揮（已有的實力）。"}},
{id:10,w:"発言",k:"はつげん",sx:"（する）",en:"statement",zh:"發言",comps:[["発","out"],["言","speak"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"手[て]を挙[あ]げてから発言[はつげん]をしてください。",exEn:"Please raise your hand before making a statement.",exZh:"請先舉手再發言。",q:{t:"yomi",s:"手を挙げてから<u>発言</u>をしてください。",c:["はつげん","はつごん","ほつげん","はっけん"],a:0,e:"「発言」讀「はつげん」。注意不要與「発見（はっけん）」混淆。"}},
{id:11,w:"発音",k:"はつおん",sx:"（する）",en:"pronounce",zh:"發音",comps:[["発","out"],["音","sound"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"言葉[ことば]を正確[せいかく]に発音[はつおん]してください。",exEn:"Please pronounce the words properly.",exZh:"請正確地發音。",q:{t:"yomi",s:"言葉を正確に<u>発音</u>してください。",c:["はつおん","はっとん","ほつおん","はつね"],a:0,e:"「発音」讀「はつおん」，「発」後接母音開頭時不促音化。"}},
{id:12,w:"発行",k:"はっこう",sx:"（する）",en:"issue",zh:"發行；核發",comps:[["発","out"],["行","go"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"市役所[しやくしょ]で証明書[しょうめいしょ]を発行[はっこう]する。",exEn:"They issue certificates at city hall.",exZh:"市公所核發證明書。",q:{t:"yomi",s:"市役所で証明書を<u>発行</u>する。",c:["はっこう","はつぎょう","はっぎょう","はつこう"],a:0,e:"「発行」讀「はっこう」，促音化。「行」此處讀「こう」。"}},
{id:13,w:"発見",k:"はっけん",sx:"（する）",en:"discover",zh:"發現",comps:[["発","out"],["見","look"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"道[みち]に迷[まよ]っている子[こ]どもを発見[はっけん]した。",exEn:"I discovered a child who was lost on the road.",exZh:"發現了一個迷路的孩子。",q:{t:"hyoki",s:"道に迷っている子どもを<u>はっけん</u>した。",c:["発見","発険","発検","発研"],a:0,e:"「はっけん」寫作「発見」＝發現。"}},
{id:14,w:"発想",k:"はっそう",sx:"（する）",en:"idea",zh:"構想；點子",comps:[["発","out"],["想","think"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"彼[かれ]の発想[はっそう]はいつも面白[おもしろ]い。",exEn:"His ideas are always interesting.",exZh:"他的點子總是很有趣。",q:{t:"bunmyaku",s:"彼の（　　）はいつも面白い。",c:["発想","発音","発行","発達"],a:0,e:"「発想」＝構想、點子。其他選項與「面白い」搭配不自然。"}},
{id:15,w:"発揮",k:"はっき",sx:"（する）",en:"show ability",zh:"發揮（實力）",comps:[["発","out"],["揮","wave"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"試験[しけん]で自分[じぶん]の実力[じつりょく]を発揮[はっき]する。",exEn:"I'll show my ability on the exam.",exZh:"在考試中發揮自己的實力。",q:{t:"yomi",s:"試験で自分の実力を<u>発揮</u>する。",c:["はっき","はつき","はっきょう","はつかい"],a:0,e:"「発揮」讀「はっき」。固定搭配：実力を発揮する。"}},
{id:16,w:"発達",k:"はったつ",sx:"（する）",en:"develop",zh:"發達；（能力、技術）發展進步",comps:[["発","out"],["達","reach"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"インターネットは発達[はったつ]し続[つづ]けている。",exEn:"The internet is continuously developing.",exZh:"網路持續發達進步。",q:{t:"yomi",s:"インターネットは<u>発達</u>し続けている。",c:["はったつ","はつたつ","はったち","はつだつ"],a:0,e:"「発達」讀「はったつ」，促音化。"}},
{id:17,w:"発展",k:"はってん",sx:"（する）",en:"develop",zh:"發展",comps:[["発","out"],["展","expand"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"技術[ぎじゅつ]が発展[はってん]することで生活[せいかつ]が変[か]わった。",exEn:"Technological development has changed our way of life.",exZh:"因為技術發展，生活改變了。",q:{t:"bunmyaku",s:"技術が（　　）することで生活が変わった。",c:["発展","発言","発音","発見"],a:0,e:"「発展」＝發展。「発達」多用於能力／機能進步，「発展」多用於規模、社會、技術的擴展。"}},
{id:18,w:"開発",k:"かいはつ",sx:"（する）",en:"develop",zh:"開發",comps:[["開","open"],["発","out"]],ch:"第1章｜Related Kanji Words 同字延伸詞",g:"発：out",ex:"日本語[にほんご]の森[もり]アプリを開発[かいはつ]しました。",exEn:"We developed the NIHONGONOMORI app.",exZh:"我們開發了「日本語之森」APP。",q:{t:"hyoki",s:"新しいアプリを<u>かいはつ</u>しました。",c:["開発","回発","改発","海発"],a:0,e:"「かいはつ」寫作「開発」＝開發（產品、技術、土地）。"}},

{id:1104,w:"捉える",k:"とらえる",sx:"",en:"grasp",zh:"掌握；理解",comps:[["捉","catch"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"た行",ex:"問題[もんだい]を正[ただ]しく捉[とら]えなければならない。",exEn:"I need to get a proper grasp of the problem.",exZh:"必須正確地掌握問題。",q:{t:"yomi",s:"問題を正しく<u>捉えなければ</u>ならない。",c:["とらえなければ","そくえなければ","とらえれば","とりえなければ"],a:0,e:"「捉える」讀「とらえる」＝掌握、理解（抽象）。「捕らえる」是抓捕（具體）。"}},
{id:1105,w:"とりあえず",k:"とりあえず",sx:"",en:"for now",zh:"暫且；首先",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"た行",ex:"とりあえず、上司[じょうし]に報告[ほうこく]する。",exEn:"For now, I'll report it to my supervisor.",exZh:"總之先向上司報告。",q:{t:"bunmyaku",s:"（　　）、上司に報告する。",c:["とりあえず","あらかじめ","ひとまず","めったに"],a:0,e:"「とりあえず」＝姑且、首先（≒ひとまず）。"}},
{id:1106,w:"摂る",k:"とる",sx:"",en:"intake",zh:"攝取（營養、飲食）",comps:[["摂","take in"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"た行",ex:"栄養[えいよう]を摂[と]ることを意識[いしき]している。",exEn:"I'm conscious of my nutritional intake.",exZh:"有意識地攝取營養。",q:{t:"hyoki",s:"栄養を<u>とる</u>ことを意識している。",c:["摂る","取る","採る","撮る"],a:0,e:"攝取營養、飲食、睡眠用「摂る」；一般拿取用「取る」。"}},
{id:1107,w:"流す",k:"ながす",sx:"",en:"flow; spread around",zh:"使流動；散布",comps:[["流","flush"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"誰[だれ]がその情報[じょうほう]を流[なが]したんですか？",exEn:"Who spread that information around?",exZh:"是誰把那個情報散布出去的？",q:{t:"yomi",s:"誰がその情報を<u>流した</u>んですか。",c:["ながした","りゅうした","なかした","ながれした"],a:0,e:"「流す」是他動詞（使流動、散布）；「流れる（ながれる）」是自動詞。"}},
{id:1108,w:"眺める",k:"ながめる",sx:"",en:"gaze",zh:"眺望；凝視",comps:[["眺","gaze"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"ホテルから海[うみ]を眺[なが]める。",exEn:"I gaze at the ocean from my hotel room.",exZh:"從飯店眺望大海。",q:{t:"yomi",s:"ホテルから海を<u>眺める</u>。",c:["ながめる","ちょうめる","なかめる","ながむる"],a:0,e:"「眺める」讀「ながめる」＝眺望、凝視。"}},
{id:1109,w:"慰める",k:"なぐさめる",sx:"",en:"console",zh:"安慰",comps:[["慰","console"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"試験[しけん]に合格[ごうかく]できなかった友達[ともだち]を慰[なぐさ]めた。",exEn:"I consoled my friend after they failed their test.",exZh:"安慰了沒能通過考試的朋友。",q:{t:"yomi",s:"試験に合格できなかった友達を<u>慰めた</u>。",c:["なぐさめた","いめた","なごめた","なぐさみた"],a:0,e:"「慰める」讀「なぐさめる」＝安慰。"}},
{id:1110,w:"亡くなる",k:"なくなる",sx:"",en:"pass away",zh:"去世；過世",comps:[["亡","pass away"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"去年[きょねん]、祖母[そぼ]が亡[な]くなった。",exEn:"My grandmother passed away last year.",exZh:"去年祖母過世了。",q:{t:"hyoki",s:"去年、祖母が<u>なくなった</u>。",c:["亡くなった","無くなった","泣くなった","失くなった"],a:0,e:"人去世用「亡くなる」；東西不見用「無くなる」。"}},
{id:1111,w:"涙",k:"なみだ",sx:"",en:"tears",zh:"眼淚",comps:[["涙","tears"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"彼[かれ]はそのドラマに感動[かんどう]して涙[なみだ]を流[なが]した。",exEn:"He was moved to tears by the drama.",exZh:"他被那部劇感動得流下眼淚。",q:{t:"yomi",s:"彼はそのドラマに感動して<u>涙</u>を流した。",c:["なみだ","るい","なだ","なみた"],a:0,e:"「涙」訓讀「なみだ」；音讀「るい」（感涙）。"}},
{id:1112,w:"なんとか",k:"なんとか",sx:"（する）",en:"somehow",zh:"設法；好不容易",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"なんとかレポートを提出[ていしゅつ]した。",exEn:"I somehow managed to submit my report.",exZh:"好不容易把報告交了出去。",q:{t:"bunmyaku",s:"（　　）レポートを提出した。",c:["なんとか","なるべく","めったに","とにかく"],a:0,e:"「なんとか」＝想辦法、勉強做到。"}},
{id:1113,w:"握る",k:"にぎる",sx:"",en:"grip",zh:"握；抓",comps:[["握","grip"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"子[こ]どもの手[て]をしっかり握[にぎ]る。",exEn:"I grip tightly to my child's hand.",exZh:"緊緊握住孩子的手。",q:{t:"yomi",s:"子どもの手をしっかり<u>握る</u>。",c:["にぎる","あくる","にきる","にぎりる"],a:0,e:"「握る」讀「にぎる」＝握。"}},
{id:1114,w:"濁る",k:"にごる",sx:"",en:"muddy",zh:"變混濁",comps:[["濁","impure"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"大雨[おおあめ]で川[かわ]の水[みず]が濁[にご]っている。",exEn:"The river water became muddy after a heavy rain.",exZh:"因大雨河水變混濁了。",q:{t:"yomi",s:"大雨で川の水が<u>濁って</u>いる。",c:["にごって","だくって","にこって","にぐって"],a:0,e:"「濁る」讀「にごる」＝變混濁。濁音也叫「濁音（だくおん）」。"}},
{id:1115,w:"抜く",k:"ぬく",sx:"",en:"pull out",zh:"拔；抽出",comps:[["抜","pull out"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"歯医者[はいしゃ]で虫歯[むしば]を抜[ぬ]いてもらった。",exEn:"I got a tooth pulled out at the dentist.",exZh:"在牙醫那裡把蛀牙拔掉了。",q:{t:"yomi",s:"歯医者で虫歯を<u>抜いて</u>もらった。",c:["ぬいて","ばついて","ぬきて","のいて"],a:0,e:"「抜く」讀「ぬく」＝拔出。"}},
{id:1116,w:"布",k:"ぬの",sx:"",en:"cloth",zh:"布",comps:[["布","cloth"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"布[ぬの]を切[き]って服[ふく]を作[つく]った。",exEn:"I cut a piece of cloth to make clothes.",exZh:"裁布做了衣服。",q:{t:"yomi",s:"<u>布</u>を切って服を作った。",c:["ぬの","ふ","ぬう","ふの"],a:0,e:"「布」訓讀「ぬの」；音讀「ふ」（布団・分布）。"}},
{id:1117,w:"願う",k:"ねがう",sx:"",en:"wish",zh:"祈願；希望",comps:[["願","wish"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"みんなが幸[しあわ]せになることを願[ねが]っている。",exEn:"I wish for everyone to live happily.",exZh:"祈願大家都能幸福。",q:{t:"yomi",s:"みんなが幸せになることを<u>願って</u>いる。",c:["ねがって","がんって","ねかって","ねがいて"],a:0,e:"「願う」讀「ねがう」＝祈願。音讀「がん」（願望・お願い）。"}},
{id:1118,w:"狙う",k:"ねらう",sx:"",en:"aim",zh:"瞄準；以〜為目標",comps:[["狙","aim"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"彼[かれ]はテニスの大会[たいかい]で優勝[ゆうしょう]を狙[ねら]っている。",exEn:"He's aiming to win the tennis tournament.",exZh:"他以網球大賽的冠軍為目標。",q:{t:"yomi",s:"彼はテニスの大会で優勝を<u>狙って</u>いる。",c:["ねらって","そらって","ねろって","ねらいて"],a:0,e:"「狙う」讀「ねらう」＝瞄準、以〜為目標。"}},
{id:1119,w:"脳",k:"のう",sx:"",en:"brain",zh:"腦",comps:[["脳","brain"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"脳[のう]はたくさんの情報[じょうほう]を処理[しょり]している。",exEn:"The brain processes lots of information.",exZh:"大腦處理著大量的資訊。",q:{t:"yomi",s:"<u>脳</u>はたくさんの情報を処理している。",c:["のう","ぼう","のお","どう"],a:0,e:"「脳」讀「のう」＝腦。"}},
{id:1120,w:"延びる",k:"のびる",sx:"",en:"extend",zh:"延長；延期（自動詞）",comps:[["延","extend"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"な行",ex:"この薬[くすり]を飲[の]むと寿命[じゅみょう]が延[の]びるらしい。",exEn:"Apparently, this medicine can extend your lifespan.",exZh:"據說吃這種藥可以延長壽命。",q:{t:"hyoki",s:"この薬を飲むと寿命が<u>のびる</u>らしい。",c:["延びる","伸びる","述べる","延ばす"],a:0,e:"時間、期限延長用「延びる」；長度、能力增長用「伸びる」。壽命用「延びる」。"}},
{id:1121,w:"述べる",k:"のべる",sx:"",en:"state",zh:"陳述；敘述",comps:[["述","state"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"た行",ex:"会議[かいぎ]で自分[じぶん]の意見[いけん]を述[の]べる。",exEn:"I'll state my opinion at the meeting.",exZh:"在會議上陳述自己的意見。",q:{t:"yomi",s:"会議で自分の意見を<u>述べる</u>。",c:["のべる","じゅつべる","のびる","のべりる"],a:0,e:"「述べる」讀「のべる」＝陳述。注意與「延びる（のびる）」區分。"}},
{id:1122,w:"〜倍",k:"〜ばい",sx:"",en:"~ times",zh:"〜倍",comps:[["倍","multiply"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"今年[ことし]から、給料[きゅうりょう]が２倍[ばい]になった。",exEn:"My salary got two times bigger this year.",exZh:"從今年起，薪水變成了兩倍。",q:{t:"yomi",s:"今年から、給料が２<u>倍</u>になった。",c:["ばい","ぱい","べい","はい"],a:0,e:"接尾辭「〜倍」讀「ばい」＝〜倍。"}},
{id:1123,w:"はきはき",k:"はきはき",sx:"（と／する）",en:"clearly",zh:"乾脆俐落地（說話）",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"先生[せんせい]の質問[しつもん]にはきはきと答[こた]えた。",exEn:"I answered the teacher's questions clearly.",exZh:"乾脆俐落地回答了老師的問題。",q:{t:"bunmyaku",s:"先生の質問に（　　）と答えた。",c:["はきはき","もぐもぐ","ぼそぼそ","だらだら"],a:0,e:"「はきはき」＝（說話）乾脆清楚、有條理。"}},
{id:1124,w:"はさむ",k:"はさむ",sx:"",en:"sandwiched",zh:"夾",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"パンに肉[にく]や野菜[やさい]をはさんで食[た]べる。",exEn:"I eat meat and vegetables sandwiched between bread.",exZh:"把肉和蔬菜夾在麵包裡吃。",q:{t:"bunmyaku",s:"パンに肉や野菜を（　　）食べる。",c:["はさんで","つまんで","つかんで","かこんで"],a:0,e:"「はさむ」（挟む）＝夾。"}},
{id:1125,w:"肌",k:"はだ",sx:"",en:"skin",zh:"肌膚",comps:[["肌","skin"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"赤[あか]ちゃんの肌[はだ]はやわらかい。",exEn:"Baby's skin is soft.",exZh:"嬰兒的肌膚很柔軟。",q:{t:"yomi",s:"赤ちゃんの<u>肌</u>はやわらかい。",c:["はだ","き","はた","ひふ"],a:0,e:"「肌」讀「はだ」＝肌膚。「皮膚（ひふ）」是醫學用語。"}},
{id:1126,w:"幅",k:"はば",sx:"",en:"width; range",zh:"寬度；範圍",comps:[["幅","width"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"海外[かいがい]へ行[い]って、経験[けいけん]の幅[はば]が広[ひろ]がった。",exEn:"My range of experience widened after going abroad.",exZh:"出國後，經驗的廣度拓寬了。",q:{t:"yomi",s:"海外へ行って、経験の<u>幅</u>が広がった。",c:["はば","ふく","はだ","はぱ"],a:0,e:"「幅」讀「はば」＝寬度、範圍。"}},
{id:1127,w:"破片",k:"はへん",sx:"",en:"broken piece",zh:"碎片",comps:[["破","break"],["片","piece"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"コップの破片[はへん]を拾[ひろ]う。",exEn:"I'll pick up the broken pieces of the cup.",exZh:"撿起杯子的碎片。",q:{t:"yomi",s:"コップの<u>破片</u>を拾う。",c:["はへん","やぶへん","はべん","はかた"],a:0,e:"「破片」讀「はへん」＝碎片。"}},
{id:1128,w:"ひざ",k:"ひざ",sx:"",en:"knee",zh:"膝蓋",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"年[とし]を取[と]るとひざが痛[いた]くなる。",exEn:"Knees start to hurt as people get older.",exZh:"上了年紀膝蓋就會痛。",q:{t:"bunmyaku",s:"年を取ると（　　）が痛くなる。",c:["ひざ","ひじ","かた","こし"],a:0,e:"「ひざ」（膝）＝膝蓋。「ひじ」（肘）是手肘。"}},
{id:1129,w:"ひどい",k:"ひどい",sx:"",en:"terrible",zh:"嚴重的；過分的",comps:[],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"ひどい渋滞[じゅうたい]で１時間[じかん]も遅[おく]れた。",exEn:"The traffic was terrible, so I was an hour late.",exZh:"嚴重塞車，遲到了一個小時。",q:{t:"bunmyaku",s:"（　　）渋滞で１時間も遅れた。",c:["ひどい","あまい","にぶい","ゆるい"],a:0,e:"「ひどい」＝嚴重的、過分的。"}},
{id:1130,w:"等しい",k:"ひとしい",sx:"",en:"equal",zh:"相等的",comps:[["等","equal"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"この２つのりんごの大[おお]きさは等[ひと]しい。",exEn:"These two apples are equal in size.",exZh:"這兩顆蘋果的大小相等。",q:{t:"yomi",s:"この２つのりんごの大きさは<u>等しい</u>。",c:["ひとしい","とうしい","ひとつしい","ひどしい"],a:0,e:"「等しい」讀「ひとしい」＝相等。"}},
{id:1131,w:"便",k:"びん",sx:"",en:"delivery",zh:"班次；郵遞",comps:[["便","delivery"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"午後[ごご]の便[びん]で荷物[にもつ]が届[とど]いた。",exEn:"My package came during afternoon delivery.",exZh:"行李在下午的班次送到了。",q:{t:"yomi",s:"午後の<u>便</u>で荷物が届いた。",c:["びん","べん","ひん","ぴん"],a:0,e:"表班次、郵遞時「便」讀「びん」（航空便）；表方便讀「べん」（便利）。"}},
{id:1132,w:"普及",k:"ふきゅう",sx:"（する）",en:"popularized",zh:"普及",comps:[["普","normalized"],["及","reach"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"世界中[せかいじゅう]にスマートフォンが普及[ふきゅう]した。",exEn:"Smartphones have become widely popularized.",exZh:"智慧型手機在全世界普及了。",q:{t:"yomi",s:"世界中にスマートフォンが<u>普及</u>した。",c:["ふきゅう","ふきゅ","ふぎゅう","ほきゅう"],a:0,e:"「普及」讀「ふきゅう」。「補給（ほきゅう）」是補給。"}},
{id:1133,w:"福祉",k:"ふくし",sx:"",en:"welfare",zh:"福利；社福",comps:[["福","fortunate"],["祉","happy"]],ch:"第2章｜Unrelated Kanji Words 獨立漢字詞",g:"は行",ex:"福祉[ふくし]の仕事[しごと]に就[つ]いて人[ひと]を助[たす]けたい。",exEn:"I want to work in welfare so I can help people.",exZh:"想從事社福工作幫助他人。",q:{t:"yomi",s:"<u>福祉</u>の仕事に就いて人を助けたい。",c:["ふくし","ふくじ","ふし","ぶくし"],a:0,e:"「福祉」讀「ふくし」＝社會福利。"}},

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* furigana: 漢字串[かな] → ruby; keep <u>,＿ */
function ruby(s){
  s=esc(s).replace(/&lt;u&gt;|&lt;u>/g,'<u>').replace(/&lt;\/u&gt;|&lt;\/u>/g,'</u>');
  return s.replace(/([㐀-鿿豈-﫿々〆ヶ]+)\[([^\]]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>');
}
/* headword + reading; skip furigana when reading == word (e.g. katakana loanwords) */
function wr(d){
  if(!d.k || d.k===d.w) return esc(d.w);
  return `<ruby>${esc(d.w)}<rt>${esc(d.k)}</rt></ruby>`;
}
function hl(s,w){ /* bold the headword in example */
  if(!w) return s;
  const bare=w.replace(/\[[^\]]+\]/g,'');
  return s;
}
const CHAPTERS=[...new Set(DATA.map(d=>d.ch))];
let mode='browse', curCh=CHAPTERS[0]||'', curGrp='__all__';

function setMode(m){
  mode=m;
  for(const x of ['browse','anki','quiz']){
    $('v-'+x).style.display = x===m?'':'none';
    $('m-'+x).classList.toggle('on',x===m);
  }
  $('search').style.display = m==='browse'?'':'none';
  if(m==='browse') renderBrowse();
  if(m==='anki'){ fillScope('ankiScope'); ankiInit(); }
  if(m==='quiz'){ fillScope('quizScope'); quizInit(); }
}

/* ---------- browse ---------- */
const stars=new Set(JSON.parse(localStorage.getItem('rkw_stars')||'[]'));
function toggleStar(id,el){ stars.has(id)?stars.delete(id):stars.add(id);
  localStorage.setItem('rkw_stars',JSON.stringify([...stars]));
  el.classList.toggle('on',stars.has(id)); }

function renderChTabs(){
  $('chTabs').innerHTML=CHAPTERS.map(c=>`<button class="${c===curCh?'on':''}" onclick="curCh='${c}';curGrp='__all__';renderBrowse()">${esc(c)}</button>`).join('');
  const grps=[...new Set(DATA.filter(d=>d.ch===curCh).map(d=>d.g))];
  $('grpChips').innerHTML=`<button class="${curGrp==='__all__'?'on':''}" onclick="curGrp='__all__';renderBrowse()">全部</button>`+
    grps.map(g=>`<button class="${g===curGrp?'on':''}" onclick="curGrp=${JSON.stringify(g).replace(/"/g,'&quot;')};renderBrowse()">${esc(g.split('：')[0])}</button>`).join('');
}
function renderBrowse(){
  renderChTabs();
  const q=$('search').value.trim().toLowerCase();
  let items=DATA.filter(d=>d.ch===curCh&&(curGrp==='__all__'||d.g===curGrp));
  if(q) items=DATA.filter(d=>(d.w+d.k+(d.en||'')+(d.zh||'')).toLowerCase().includes(q));
  $('cnt').textContent=`共 ${items.length} 個單字`+(q?`（搜尋「${q}」）`:'');
  let html='',lastG='';
  for(const d of items){
    if(d.g!==lastG){ html+=`<div class="gtitle">${esc(d.g)}</div>`; lastG=d.g; }
    html+=`<div class="card">
      <div class="top"><span class="num">${String(d.id).padStart(4,'0')}</span>
        <span class="w">${wr(d)}</span>
        ${d.sx?`<span class="suffix">${esc(d.sx)}</span>`:''}
        <span class="star ${stars.has(d.id)?'on':''}" onclick="toggleStar(${d.id},this)">★</span></div>
      <div class="meaning"><span class="zh">${esc(d.zh)}</span><span class="en">${esc(d.en)}</span></div>
      ${d.comps&&d.comps.length?`<div class="comps">${d.comps.map(c=>`<div class="comp">${esc(c[0])}<small>${esc(c[1])}</small></div>`).join('<span class="plus">＋</span>')}</div>`:''}
      ${d.ex?`<div class="ex">${ruby(d.ex)}
         <div class="tr">${esc(d.exEn||'')}</div>
         <div class="trzh">${esc(d.exZh||'')}</div></div>`:''}
    </div>`;
  }
  $('list').innerHTML=html||'<div class="empty">沒有符合的單字</div>';
}

/* ---------- scope select (shared) ---------- */
function fillScope(selId){
  const sel=$(selId); const cur=sel.value;
  let opts=`<option value="__all__">全部單字</option><option value="__star__">★ 已加星號</option>`;
  for(const c of CHAPTERS){
    opts+=`<option value="ch:${c}">【章】${c}</option>`;
    for(const g of [...new Set(DATA.filter(d=>d.ch===c).map(d=>d.g))])
      opts+=`<option value="g:${g}">　${g}</option>`;
  }
  sel.innerHTML=opts; if(cur) sel.value=cur;
}
function scopeItems(val){
  if(val==='__star__') return DATA.filter(d=>stars.has(d.id));
  if(val&&val.startsWith('ch:')) return DATA.filter(d=>d.ch===val.slice(3));
  if(val&&val.startsWith('g:')) return DATA.filter(d=>d.g===val.slice(2));
  return DATA.slice();
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- anki ---------- */
let ankiDeck=[],ankiIdx=0,ankiShown=false;
const prog=JSON.parse(localStorage.getItem('rkw_prog')||'{}'); // id -> 1 known / 0 unknown
function ankiInit(){
  let items=scopeItems($('ankiScope').value);
  if($('ankiUnknownOnly').checked) items=items.filter(d=>prog[d.id]!==1);
  ankiDeck=shuffle(items.slice()); ankiIdx=0; ankiShown=false; ankiRender();
}
function ankiRender(){
  const p=$('ankiPanel');
  if(!ankiDeck.length){ p.innerHTML='<div class="empty">此範圍沒有卡片 🎉</div>'; return; }
  if(ankiIdx>=ankiDeck.length){
    const known=ankiDeck.filter(d=>prog[d.id]===1).length;
    p.innerHTML=`<div style="font-size:20px;margin:20px 0">本輪完成！</div>
      <div>記得：${known} ／ ${ankiDeck.length}</div>
      <div class="ansrow"><button class="btn show" onclick="ankiInit()">再來一輪</button></div>`;
    return;
  }
  const d=ankiDeck[ankiIdx];
  let inner=`<div class="statline">${ankiIdx+1} / ${ankiDeck.length}${ankiShown?'　・　'+esc(d.g):''}</div>
    <div class="bigkana">${esc(d.k)}${d.sx?`<span style="font-size:16px;color:var(--sub)"> ${esc(d.sx)}</span>`:''}</div>`;
  if(!ankiShown){
    inner+=`<div class="ansrow"><button class="btn show" onclick="ankiShown=true;ankiRender()">顯示答案</button>
      <button class="btn ghost" onclick="ankiIdx++;ankiShown=false;ankiRender()">跳過</button></div>`;
  }else{
    inner+=`<div class="bigword">${wr(d)}</div>
      <div class="meaning"><span class="zh">${esc(d.zh)}</span><span class="en">${esc(d.en)}</span></div>
      ${d.ex?`<div class="ex" style="text-align:left">${ruby(d.ex)}<div class="trzh">${esc(d.exZh||'')}</div></div>`:''}
      <div class="ansrow">
        <button class="btn again" onclick="ankiMark(0)">不記得 ✗</button>
        <button class="btn good" onclick="ankiMark(1)">記得 ✓</button>
      </div>`;
  }
  p.innerHTML=inner;
}
function ankiMark(v){
  prog[ankiDeck[ankiIdx].id]=v;
  localStorage.setItem('rkw_prog',JSON.stringify(prog));
  ankiIdx++;ankiShown=false;ankiRender();
}
function ankiResetProg(){
  if(confirm('確定要清除所有「記得／不記得」紀錄嗎？')){
    localStorage.removeItem('rkw_prog');
    for(const k in prog) delete prog[k];
    ankiInit();
  }
}

/* ---------- quiz ---------- */
let quizDeck=[],quizIdx=0,quizScore=0,quizAnswered=false;
const QTYPE={yomi:'漢字讀音',hyoki:'漢字寫法',bunmyaku:'文脈規定',ruigi:'近義替換',yoho:'用法'};
function quizInit(){
  quizDeck=shuffle(scopeItems($('quizScope').value).filter(d=>d.q));
  quizIdx=0;quizScore=0;quizAnswered=false;quizRender();
}
function quizRender(){
  const p=$('quizPanel');
  if(!quizDeck.length){ p.innerHTML='<div class="empty">此範圍沒有題目</div>'; return; }
  if(quizIdx>=quizDeck.length){
    p.innerHTML=`<div style="font-size:20px;margin:20px 0">測驗完成！</div>
      <div style="font-size:32px;font-weight:700">${quizScore} ／ ${quizDeck.length}</div>
      <div class="ansrow"><button class="btn show" onclick="quizInit()">再測一次</button></div>`;
    return;
  }
  const d=quizDeck[quizIdx],q=d.q;
  p.innerHTML=`<div class="qmeta">第 ${quizIdx+1} ／ ${quizDeck.length} 題　・　${QTYPE[q.t]||q.t}</div>
    <div class="qstem">${ruby(q.s)}</div>
    <div class="choices">${q.c.map((c,i)=>`<button id="qc${i}" onclick="quizPick(${i})">${'①②③④'[i]}　${ruby(c)}</button>`).join('')}</div>
    <div class="expl" id="qexpl"></div>
    <div class="ansrow" id="qnext" style="display:none"><button class="btn show" onclick="quizIdx++;quizAnswered=false;quizRender()">下一題 →</button></div>
    <div class="scoreline">目前得分：${quizScore}</div>`;
}
function quizPick(i){
  if(quizAnswered) return; quizAnswered=true;
  const d=quizDeck[quizIdx],q=d.q;
  $('qc'+q.a).classList.add('correct');
  if(i===q.a){ quizScore++; } else { $('qc'+i).classList.add('wrong'); }
  const ex=$('qexpl');
  ex.style.display='block';
  ex.innerHTML=`${i===q.a?'⭕ 答對了！':'❌ 答錯了。'}正確答案：${'①②③④'[q.a]}<br>
    <b>${wr(d)}</b>：${esc(d.zh)}（${esc(d.en)}）<br>${esc(q.e||'')}`;
  $('qnext').style.display='flex';
}

/* boot */
if(DATA.length){ curCh=CHAPTERS[0]; renderBrowse(); }
else $('list').innerHTML='<div class="empty">資料載入中…（建置中）</div>';
</script>
